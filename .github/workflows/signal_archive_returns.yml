name: Signal Archive Returns Update

on:
  # 2026-08-14：從固定 cron 時間改成接在 daily_signals 完成後觸發（workflow_run，
  # 跟 daily_signals 接在 margin_trade_backfill 後面的做法一致）。原因同
  # daily_signals.yml 的說明：cron 表訂時間 vs 實際觸發時間普遍有 40~80 分鐘落差，
  # 且各 workflow 延遲幅度不同步，固定時間 + 猜緩衝不夠可靠。
  #
  # run_signal_archive_returns.py 未帶日期時的預設邏輯本來就有處理「00:00-19:59
  # 視為前一個交易日」，不論實際被觸發在幾點都能正確解析到 daily_signals 剛產生的
  # 那個目標交易日，不需要额外調整。
  workflow_run:
    workflows: ["Daily Signals Generation"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_date:
        description: '目標交易日 (YYYY-MM-DD)，手動補跑時可指定，例如 2026-04-30'
        required: false

jobs:
  update_signal_returns:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 僅在 daily_signals 成功時跑（workflow_run 觸發時 conclusion 才有值）。
    # workflow_dispatch 沒有 workflow_run，event 名稱判斷成立後 conclusion 為空 → 也允許跑。
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Update archive returns
        id: returns
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set +e
          if [ -n "$INPUT_DATE" ]; then
            python3 run_signal_archive_returns.py "$INPUT_DATE"
          else
            python3 run_signal_archive_returns.py
          fi
          RETURNS_EXIT=$?
          echo "returns_exit=$RETURNS_EXIT" >> "$GITHUB_OUTPUT"
          echo "Signal archive returns exit code: $RETURNS_EXIT"
          exit 0

      - name: Evaluate final status
        if: always()
        run: |
          FINAL_EXIT="${{ steps.returns.outputs.returns_exit }}"
          echo "Final archive returns exit code: $FINAL_EXIT"
          case "$FINAL_EXIT" in
            0) echo "Status: ok" ;;
            1) echo "Status: no_data (no signal rows or no eligible trade data)" ;;
            2) echo "Status: error (FAIL)" ;;
            *) echo "Status: unknown (exit=$FINAL_EXIT)" ;;
          esac
          case "$FINAL_EXIT" in
            0|1) exit 0 ;;
            *) exit 1 ;;
          esac
