name: Broker Trade Backfill

on:
  schedule:
    - cron: '5 * * * *'   # 每小時第 5 分鐘執行，避免整點擁塞
  workflow_dispatch:
    inputs:
      end_date:
        description: '目標結束日期 (YYYY-MM-DD)，預設為昨天'
        required: false
      batch_days:
        description: '每批交易日數 (預設 3)'
        required: false
        default: '3'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Determine next batch date range
        id: dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          END_DATE_INPUT: ${{ github.event.inputs.end_date }}
          BATCH_DAYS: ${{ github.event.inputs.batch_days || '3' }}
        run: |
          python3 - <<'EOF'
          import os, sys
          from datetime import date, timedelta
          from sqlalchemy import create_engine, text

          db_url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://", 1)
          engine = create_engine(db_url)
          with engine.connect() as conn:
              # 建立 checkpoint 表（若不存在）
              conn.execute(text("""
                  CREATE TABLE IF NOT EXISTS etl_checkpoint (
                      step_name TEXT PRIMARY KEY,
                      last_end_date DATE NOT NULL
                  )
              """))
              conn.commit()

              # 取 DB 實際資料的最大日期
              row_data = conn.execute(text(
                  "SELECT MAX(trade_date) FROM broker_trade_agg"
              )).fetchone()
              max_data_date = row_data[0]

              # 取 checkpoint 記錄的最後嘗試日期
              row_ckpt = conn.execute(text(
                  "SELECT last_end_date FROM etl_checkpoint "
                  "WHERE step_name = 'broker_trade_backfill'"
              )).fetchone()
              max_ckpt_date = row_ckpt[0] if row_ckpt else None

          # 用兩者較大的日期 +1 作為起始日，確保假日也能跳過
          candidates = [d for d in [max_data_date, max_ckpt_date] if d]
          if candidates:
              start = max(candidates) + timedelta(days=1)
          else:
              start = date(2021, 6, 30)

          print(f"max_data_date={max_data_date}, max_ckpt_date={max_ckpt_date}, start={start}")

          # 目標結束日（預設昨天）
          target_end_str = os.environ.get("END_DATE_INPUT", "").strip()
          if target_end_str:
              target_end = date.fromisoformat(target_end_str)
          else:
              target_end = date.today() - timedelta(days=1)

          batch_days = int(os.environ.get("BATCH_DAYS", "3"))

          if start > target_end:
              print(f"Already up to date (max_data={max_data_date}, ckpt={max_ckpt_date}, target={target_end})")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              sys.exit(0)

          # 往前數 batch_days 個交易日（跳過週末）
          trading_days_found = 0
          end = start
          d = start
          while d <= target_end:
              if d.isoweekday() <= 5:  # 週一到週五
                  trading_days_found += 1
                  end = d
                  if trading_days_found >= batch_days:
                      break
              d += timedelta(days=1)
          end = min(end, target_end)

          print(f"Batch: {start} ~ {end} (target end: {target_end})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"start_date={start}\n")
              f.write(f"end_date={end}\n")
              f.write("skip=false\n")
          EOF

      - name: Run broker trade ETL
        if: steps.dates.outputs.skip != 'true'
        working-directory: backend
        run: |
          python3 run_finmind_etl_sdk.py \
            --start-date ${{ steps.dates.outputs.start_date }} \
            --end-date ${{ steps.dates.outputs.end_date }} \
            --steps broker_trade_agg \
            --skip-log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: Update checkpoint
        if: steps.dates.outputs.skip != 'true' && success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          python3 - <<'EOF'
          import os
          from sqlalchemy import create_engine, text

          db_url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://", 1)
          end_date = os.environ["END_DATE"]
          engine = create_engine(db_url)
          with engine.connect() as conn:
              conn.execute(text("""
                  INSERT INTO etl_checkpoint (step_name, last_end_date)
                  VALUES ('broker_trade_backfill', :end_date)
                  ON CONFLICT (step_name)
                  DO UPDATE SET last_end_date = EXCLUDED.last_end_date
              """), {"end_date": end_date})
              conn.commit()
          print(f"Checkpoint updated: broker_trade_backfill -> {end_date}")
          EOF

      - name: Report result
        if: always()
        run: |
          echo "Batch: ${{ steps.dates.outputs.start_date }} ~ ${{ steps.dates.outputs.end_date }}"
          echo "Skip: ${{ steps.dates.outputs.skip }}"
