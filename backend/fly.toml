app = "always-stock-api"
primary_region = "nrt"  # Tokyo (closest to Taiwan)

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/tw_stock.db"
  TZ = "Asia/Taipei"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "stock_data"
  destination = "/data"
