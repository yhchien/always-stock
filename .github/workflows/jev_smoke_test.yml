name: Jev Gateway Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependency
        run: python -m pip install --quiet requests

      - name: Call Jev through Vercel AI Gateway
        working-directory: backend
        run: python3 scripts/jev_smoke_test.py
