name: Broker Trade Backfill

on:
  schedule:
    - cron: '5 * * * *'   # 每小時第 5 分鐘執行，避免整點擁塞
  workflow_dispatch:
    inputs:
      end_date:
        description: '目標結束日期 (YYYY-MM-DD)，預設為昨天'
        required: false
      batch_days:
        description: '每批交易日數 (預設 3，受限於 FinMind 6000 req/hr；1 日 ≈ 1588 req)'
        required: false
        default: '3'
      min_backfill_date:
        description: 'backfill 最早日期 (YYYY-MM-DD)，預設 2022-01-01'
        required: false
        default: '2022-01-01'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Determine next batch date range
        id: dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          END_DATE_INPUT: ${{ github.event.inputs.end_date }}
          BATCH_DAYS: ${{ github.event.inputs.batch_days || '3' }}
          MIN_BACKFILL_DATE: ${{ github.event.inputs.min_backfill_date || '2022-01-01' }}
        run: |
          python3 - <<'EOF'
          import os, sys
          from datetime import date, timedelta
          from sqlalchemy import create_engine, text

          db_url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://", 1)
          engine = create_engine(db_url)

          # 目標結束日（預設昨天）
          target_end_str = os.environ.get("END_DATE_INPUT", "").strip()
          if target_end_str:
              target_end = date.fromisoformat(target_end_str)
          else:
              target_end = date.today() - timedelta(days=1)

          min_backfill_date = date.fromisoformat(os.environ["MIN_BACKFILL_DATE"])
          batch_days = int(os.environ.get("BATCH_DAYS", "3"))

          with engine.connect() as conn:
              # 建立 checkpoint 表（若不存在）— 僅作為 monitoring，不再驅動 start 計算
              conn.execute(text("""
                  CREATE TABLE IF NOT EXISTS etl_checkpoint (
                      step_name TEXT PRIMARY KEY,
                      last_end_date DATE NOT NULL
                  )
              """))
              conn.commit()

              # 找出 [min_backfill_date, target_end] 範圍內「缺資料」的週一~五交易日
              rows = conn.execute(text("""
                  WITH expected AS (
                      SELECT generate_series(:min_date, :end_date, '1 day'::interval)::date AS d
                  ),
                  actual AS (
                      SELECT DISTINCT trade_date FROM broker_trade_agg
                      WHERE trade_date BETWEEN :min_date AND :end_date
                  )
                  SELECT e.d FROM expected e
                  LEFT JOIN actual a ON a.trade_date = e.d
                  WHERE EXTRACT(ISODOW FROM e.d) <= 5
                    AND a.trade_date IS NULL
                  ORDER BY e.d
                  LIMIT :batch_limit
              """), {
                  "min_date": min_backfill_date,
                  "end_date": target_end,
                  "batch_limit": batch_days,
              }).fetchall()

              # 順便算一下「總剩餘缺日」方便追蹤進度
              total_remaining = conn.execute(text("""
                  WITH expected AS (
                      SELECT generate_series(:min_date, :end_date, '1 day'::interval)::date AS d
                  ),
                  actual AS (
                      SELECT DISTINCT trade_date FROM broker_trade_agg
                      WHERE trade_date BETWEEN :min_date AND :end_date
                  )
                  SELECT COUNT(*) FROM expected e
                  LEFT JOIN actual a ON a.trade_date = e.d
                  WHERE EXTRACT(ISODOW FROM e.d) <= 5
                    AND a.trade_date IS NULL
              """), {"min_date": min_backfill_date, "end_date": target_end}).fetchone()[0]

          gaps = [row[0] for row in rows]
          print(f"Backfill range: [{min_backfill_date}, {target_end}]")
          print(f"Total remaining gaps: {total_remaining}")

          if not gaps:
              print("No gaps left, skipping")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              sys.exit(0)

          # 用最舊~最新缺日當 ETL 範圍；中間若有 non-gap 日會被重新 upsert（idempotent）
          start, end = gaps[0], gaps[-1]
          print(f"Batch: {start} ~ {end} (selected {len(gaps)} gap days, target end: {target_end})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"start_date={start}\n")
              f.write(f"end_date={end}\n")
              f.write("skip=false\n")
          EOF

      - name: Run broker trade ETL
        if: steps.dates.outputs.skip != 'true'
        working-directory: backend
        run: |
          python3 run_finmind_etl_sdk.py \
            --start-date ${{ steps.dates.outputs.start_date }} \
            --end-date ${{ steps.dates.outputs.end_date }} \
            --steps broker_trade_agg \
            --skip-log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: Update checkpoint
        if: steps.dates.outputs.skip != 'true' && success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          python3 - <<'EOF'
          import os
          from sqlalchemy import create_engine, text

          db_url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://", 1)
          end_date = os.environ["END_DATE"]
          engine = create_engine(db_url)
          with engine.connect() as conn:
              conn.execute(text("""
                  INSERT INTO etl_checkpoint (step_name, last_end_date)
                  VALUES ('broker_trade_backfill', :end_date)
                  ON CONFLICT (step_name)
                  DO UPDATE SET last_end_date = EXCLUDED.last_end_date
              """), {"end_date": end_date})
              conn.commit()
          print(f"Checkpoint updated: broker_trade_backfill -> {end_date}")
          EOF

      - name: Report result
        if: always()
        run: |
          echo "Batch: ${{ steps.dates.outputs.start_date }} ~ ${{ steps.dates.outputs.end_date }}"
          echo "Skip: ${{ steps.dates.outputs.skip }}"
