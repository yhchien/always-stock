name: Daily ETL Update

on:
  schedule:
    # 台北 18:17（週一到週五）= UTC 10:17（刻意錯開整點，降低 GitHub schedule 被高負載丟棄的機率）
    # GitHub Actions cron 只吃 UTC，無法直接指定 Asia/Taipei
    # 若遇國定假日，ETL 會由 daily_price 空資料自動短路為 holiday
    - cron: '17 10 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目標交易日 (YYYY-MM-DD)，預設為台北當日'
        required: false

jobs:
  run_etl:
    runs-on: ubuntu-latest
    # 首次 75 min + sleep 90 min + 重試 75 min + M25 wtq 60 min = 300 min
    timeout-minutes: 300

    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Resolve target date
        id: resolve
        env:
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          # cron 目標是台北 18:00，但 GitHub Actions 偶爾會延遲，甚至可能跨到次日 00:xx。
          # 往前推 8 小時可確保延遲到次日凌晨時，target_date 仍落在原本預期的交易日。
          # 手動觸發時若有填 INPUT_DATE 則尊重之。
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(date -d '8 hours ago' +%F)
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date (Taipei): $TARGET_DATE"

      - name: Run FinMind ETL (attempt 1)
        id: etl1
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python3 run_finmind_etl_sdk.py --date ${{ steps.resolve.outputs.target_date }}
          ETL_EXIT=$?
          echo "etl_exit=$ETL_EXIT" >> "$GITHUB_OUTPUT"
          echo "ETL attempt 1 exit code: $ETL_EXIT"
          exit 0

      - name: Sleep 1.5h before retry (quota recovery)
        if: steps.etl1.outputs.etl_exit == '2'
        run: |
          echo "Attempt 1 hit insufficient_quota; sleeping 5400s (1.5h) before retry..."
          sleep 5400

      - name: Run FinMind ETL (attempt 2, retry)
        id: etl2
        if: steps.etl1.outputs.etl_exit == '2'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python3 run_finmind_etl_sdk.py --date ${{ steps.resolve.outputs.target_date }}
          ETL_EXIT=$?
          echo "etl_exit=$ETL_EXIT" >> "$GITHUB_OUTPUT"
          echo "ETL attempt 2 exit code: $ETL_EXIT"
          exit 0

      - name: Compute final ETL exit code
        id: etl_final
        if: always()
        run: |
          FINAL_EXIT="${{ steps.etl2.outputs.etl_exit || steps.etl1.outputs.etl_exit }}"
          echo "final_exit=$FINAL_EXIT" >> "$GITHUB_OUTPUT"
          echo "Final ETL exit code: $FINAL_EXIT"

      # M25：ETL ok (0) / partial (1) 才跑 watchlist trade quality；
      # holiday (5) → 沒新交易日資料、wtq 自身會 holiday-skip 但 cron quota 仍會跑無意義；
      # quota (2) / error (3) → 跳過 wtq 避免在不完整資料上產出快照。
      - name: Run watchlist trade quality refresh (M25)
        id: wtq
        if: steps.etl_final.outputs.final_exit == '0' || steps.etl_final.outputs.final_exit == '1'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set +e
          python3 run_watchlist_trade_quality.py --date ${{ steps.resolve.outputs.target_date }}
          WTQ_EXIT=$?
          echo "wtq_exit=$WTQ_EXIT" >> "$GITHUB_OUTPUT"
          echo "Watchlist trade quality exit code: $WTQ_EXIT"
          # 不讓 wtq 失敗影響整個 workflow（ETL 才是 critical；wtq 是 enrichment）
          exit 0

      - name: Evaluate final status
        if: always()
        run: |
          FINAL_EXIT="${{ steps.etl_final.outputs.final_exit }}"
          WTQ_EXIT="${{ steps.wtq.outputs.wtq_exit || 'skipped' }}"
          echo "Target date: ${{ steps.resolve.outputs.target_date }}"
          echo "Attempt 1 exit: ${{ steps.etl1.outputs.etl_exit }}"
          echo "Attempt 2 exit: ${{ steps.etl2.outputs.etl_exit || 'N/A' }}"
          echo "Final ETL exit code: $FINAL_EXIT"
          echo "Watchlist trade quality exit: $WTQ_EXIT"
          case "$FINAL_EXIT" in
            0) echo "Status: ok" ;;
            1) echo "Status: partial" ;;
            2) echo "Status: insufficient_quota (FAIL, retry exhausted)" ;;
            3) echo "Status: error" ;;
            5) echo "Status: holiday (non-trading day, skipped)" ;;
            *) echo "Status: unknown (exit=$FINAL_EXIT)" ;;
          esac
          case "$WTQ_EXIT" in
            0) echo "WTQ: ok" ;;
            1) echo "WTQ: partial (some failed)" ;;
            2) echo "WTQ: all_failed" ;;
            5) echo "WTQ: holiday/no-data" ;;
            skipped) echo "WTQ: skipped (ETL not ok)" ;;
            *) echo "WTQ: unknown ($WTQ_EXIT)" ;;
          esac
          # 0=ok / 1=partial / 5=holiday → workflow pass
          # 2=quota / 3=error → workflow fail
          case "$FINAL_EXIT" in
            0|1|5) exit 0 ;;
            *) exit 1 ;;
          esac
