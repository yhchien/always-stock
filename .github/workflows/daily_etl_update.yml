name: Daily ETL Update

on:
  schedule:
    # 台北 23:00（週一到週五）= UTC 15:00
    # GitHub Actions cron 只吃 UTC，無法直接指定 Asia/Taipei
    # 23:00 是為了對齊 FinMind 慢同步 dataset（inst_flow / daily_valuation）
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目標交易日 (YYYY-MM-DD)，預設為台北當日'
        required: false

jobs:
  run_etl:
    runs-on: ubuntu-latest
    # 首次 75 min + sleep 90 min + 重試 75 min = 240 min（含 buffer）
    timeout-minutes: 240

    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Resolve target date
        id: resolve
        env:
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          # cron 排程在台北 23:00，但 GitHub Actions cron 常延遲 10~90 分鐘，
          # 延遲到台北 00:xx 就會跨到次日，date +%F 給出「明天」→ 抓空資料 → 被誤判 holiday。
          # 往前推 4 小時確保永遠落在 cron 預期的當日（23:00 跑 → 19:00 offset、
          # 00:30 延遲 → 20:30 offset，都仍是當日）。手動觸發時若有填 INPUT_DATE 則尊重之。
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(date -d '4 hours ago' +%F)
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date (Taipei): $TARGET_DATE"

      - name: Run FinMind ETL (attempt 1)
        id: etl1
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python3 run_finmind_etl_sdk.py --date ${{ steps.resolve.outputs.target_date }}
          ETL_EXIT=$?
          echo "etl_exit=$ETL_EXIT" >> "$GITHUB_OUTPUT"
          echo "ETL attempt 1 exit code: $ETL_EXIT"
          exit 0

      - name: Sleep 1.5h before retry (quota recovery)
        if: steps.etl1.outputs.etl_exit == '2'
        run: |
          echo "Attempt 1 hit insufficient_quota; sleeping 5400s (1.5h) before retry..."
          sleep 5400

      - name: Run FinMind ETL (attempt 2, retry)
        id: etl2
        if: steps.etl1.outputs.etl_exit == '2'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python3 run_finmind_etl_sdk.py --date ${{ steps.resolve.outputs.target_date }}
          ETL_EXIT=$?
          echo "etl_exit=$ETL_EXIT" >> "$GITHUB_OUTPUT"
          echo "ETL attempt 2 exit code: $ETL_EXIT"
          exit 0

      - name: Evaluate final status
        if: always()
        run: |
          FINAL_EXIT="${{ steps.etl2.outputs.etl_exit || steps.etl1.outputs.etl_exit }}"
          echo "Target date: ${{ steps.resolve.outputs.target_date }}"
          echo "Attempt 1 exit: ${{ steps.etl1.outputs.etl_exit }}"
          echo "Attempt 2 exit: ${{ steps.etl2.outputs.etl_exit || 'N/A' }}"
          echo "Final ETL exit code: $FINAL_EXIT"
          case "$FINAL_EXIT" in
            0) echo "Status: ok" ;;
            1) echo "Status: partial" ;;
            2) echo "Status: insufficient_quota (FAIL, retry exhausted)" ;;
            3) echo "Status: error" ;;
            5) echo "Status: holiday (non-trading day, skipped)" ;;
            *) echo "Status: unknown (exit=$FINAL_EXIT)" ;;
          esac
          # 0=ok / 1=partial / 5=holiday → workflow pass
          # 2=quota / 3=error → workflow fail
          case "$FINAL_EXIT" in
            0|1|5) exit 0 ;;
            *) exit 1 ;;
          esac
