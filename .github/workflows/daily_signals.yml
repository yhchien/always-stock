name: Daily Signals Generation

on:
  # 2026-08-14：從固定 cron 時間改成接在 margin_trade_backfill 完成後觸發
  # （workflow_run，跟 signal_expectation_prices 接在本 workflow 後面的做法一致）。
  #
  # 原本用固定 cron（19:23，後來一度改到 23:05）想跑在 margin_trade_backfill
  # （22:30）之後，但實測 gh run list 發現：GitHub Actions 排定的 cron 實際觸發
  # 時間普遍比表訂時間晚 40~80 分鐘（不論訂幾點、有沒有錯開整點），而且每個
  # workflow 延遲幅度不同步——固定時間 + 猜一個緩衝，仍然可能撞回「margin 資料
  # 還沒同步完就跑」的問題。改用 workflow_run 直接綁定「margin_trade_backfill
  # 真的完成」這個事件，徹底消除這個時間差風險（signal_expectation_prices 這樣
  # 接在本 workflow 後面，觀測到的額外延遲只有 2~3 秒，遠比 cron 猜時間可靠）。
  #
  # margin_trade_backfill 已改成每天跑（見該檔案），所以這裡連帶自動涵蓋週末補班
  # 開盤，不需要額外的 schedule fallback。
  workflow_run:
    workflows: ["Margin Trade Backfill"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_date:
        description: '目標分析日期 (YYYY-MM-DD)，預設依台北 19:00 分界自動解析'
        required: false
      prompt_family:
        description: 'Prompt family（v7 或 legacy_split）'
        required: false
        default: 'v7'
        type: choice
        options:
          - v7
          - legacy_split

permissions:
  contents: read

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run_signals:
    runs-on: ubuntu-latest
    # v7 structured research 失敗時會二分重試，保留額外修復時間。
    timeout-minutes: 120

    # 僅在 margin_trade_backfill 成功時跑（workflow_run 觸發時 conclusion 才有值）。
    # workflow_dispatch 沒有 workflow_run，event 名稱判斷成立後 conclusion 為空 → 也允許跑。
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt

      - name: Resolve target date
        id: resolve
        env:
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          # workflow 預設與 backend/run_daily_signals.py 保持一致：
          # - 台北 19:00 後：target_date = 今天
          # - 台北 19:00 前：target_date = 昨天
          # 手動觸發若帶 INPUT_DATE 則尊重之。
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            HOUR=$(date +%H)
            if [ "$HOUR" -ge 19 ]; then
              TARGET_DATE=$(date +%F)
            else
              TARGET_DATE=$(date -d '1 day ago' +%F)
            fi
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date (Taipei): $TARGET_DATE"

      - name: Run signal pipeline
        id: signals
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_SIGNALS_MODEL || 'gpt-5.4-mini' }}
          OPENAI_SIGNALS_MARKET_MODEL: ${{ secrets.OPENAI_SIGNALS_MARKET_MODEL || 'gpt-5.4-mini' }}
          OPENAI_SIGNALS_RESEARCH_MODEL: ${{ secrets.OPENAI_SIGNALS_RESEARCH_MODEL || 'gpt-5.4-mini' }}
          OPENAI_SIGNALS_DECISION_MODEL: ${{ secrets.OPENAI_SIGNALS_DECISION_MODEL || 'gpt-5.4' }}
          OPENAI_SIGNALS_REASON_MODEL: ${{ secrets.OPENAI_SIGNALS_REASON_MODEL || 'gpt-5.4-mini' }}
          SIGNALS_PROMPT_FAMILY: ${{ github.event.inputs.prompt_family || 'v7' }}
          SIGNALS_PIPELINE_MODE: phase2
        run: |
          set +e
          python3 run_daily_signals.py ${{ steps.resolve.outputs.target_date }}
          PIPELINE_EXIT=$?
          echo "pipeline_exit=$PIPELINE_EXIT" >> "$GITHUB_OUTPUT"
          echo "Signal pipeline exit code: $PIPELINE_EXIT"
          exit 0

      - name: Evaluate final status
        if: always()
        run: |
          FINAL_EXIT="${{ steps.signals.outputs.pipeline_exit }}"
          echo "Target date: ${{ steps.resolve.outputs.target_date }}"
          echo "Final pipeline exit code: $FINAL_EXIT"
          # run_daily_signals.py exit codes:
          #   0 = ok
          #   1 = no_data（候選池為空 / 無交易日）→ workflow pass，當天無訊號是合理結果
          #   2 = llm_error（OpenAI / prompt 失敗）→ workflow fail，需重跑
          #   3 = db_error（DB 連線 / pipeline crash）→ workflow fail
          #   4 = partial_failure（snapshot 已保存但結果不完整）→ workflow fail，需重跑
          case "$FINAL_EXIT" in
            0) echo "Status: ok" ;;
            1) echo "Status: no_data (no candidate stocks; non-trading day or quiet market)" ;;
            2) echo "Status: llm_error (FAIL)" ;;
            3) echo "Status: db_error (FAIL)" ;;
            4) echo "Status: partial_failure (FAIL; snapshot is incomplete)" ;;
            *) echo "Status: unknown (exit=$FINAL_EXIT)" ;;
          esac
          # 0 / 1 → pass；2 / 3 / 4 → fail
          case "$FINAL_EXIT" in
            0|1) exit 0 ;;
            *) exit 1 ;;
          esac
